<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoxForge Gaming — PC Components & Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="promo-strip" role="region" aria-label="Promotional banner">
    <div class="promo-track">
      <div class="promo-content">🔥 FLASH SALE: 20% OFF ALL RAZER PERIPHERALS — ENDS IN 04:22:10</div>
    </div>
  </div>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">VoxForge</div>
      <nav class="nav">
        <a href="#brands">Brands</a>
      </nav>
    </div>
  </header> 

  <main>
    <section class="hero">
      <div class="container">
        <h1>Next-Gen PC Parts & Games</h1>
        <p>High-performance components, curated for gamers and creators.</p>
      </div>
    </section>

    <section id="brands" class="brands container">
      <h2>Top Brands</h2>
      <div class="brand-grid">
        <div class="brand"><img class="brand-logo" src="assets/logos/razer.svg" alt="Razer logo"><span>Razer</span></div>
        <div class="brand"><img class="brand-logo" src="assets/logos/steelseries.svg" alt="SteelSeries logo"><span>SteelSeries</span></div>
        <div class="brand"><img class="brand-logo" src="assets/logos/skullcandy-1.svg" alt="Skullcandy logo"><span>Skullcandy</span></div>
        <div class="brand"><img class="brand-logo" src="assets/logos/amd-logo-1.svg" alt="AMD logo"><span>AMD</span></div>
        <div class="brand"><img class="brand-logo" src="assets/logos/nvidia.svg" alt="NVIDIA logo"><span>NVIDIA</span></div>
        <div class="brand"><img class="brand-logo" src="assets/logos/corsair.svg" alt="Corsair logo"><span>Corsair</span></div>
      </div>
    </section>
    <!-- Parts & Accessories (demo hardcoded list) -->
    <section id="parts" class="container products">
      <h2>Parts & Accessories</h2>
      <div class="product-grid" id="demoPartsGrid">
        <!-- Demo parts populated by script -->
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">© 2026 VoxForge — Built for gamers</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
